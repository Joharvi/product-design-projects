<!DOCTYPE html>
<html lang="en" data-theme="night" data-ds="slds2">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Design Projects — Joharvi Garcia</title>

  <!-- Salesforce Brand fonts — Salesforce Sans + Avant Garde For Salesforce -->
  <link rel="stylesheet" href="https://sfdc-ui-documentation-667d4c5e8394.herokuapp.com/dms-design-tokens/fonts.css">

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
</head>
<body>

<div class="console-shell">
  <div id="backdrop" aria-hidden="true"></div>

  <header class="console-header" role="banner">
    <!-- Salesforce Cloud logo mark -->
    <svg class="console-header__logo" viewBox="0 0 60 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Salesforce" role="img">
      <path d="M24.9 7.4C27.1 5.3 30.1 4 33.4 4c6.5 0 11.9 4.8 12.7 11.1.7-.2 1.4-.3 2.2-.3 4.8 0 8.7 3.9 8.7 8.7s-3.9 8.7-8.7 8.7H11.3C6.7 32.2 3 28.5 3 23.9c0-3.9 2.6-7.2 6.2-8.3C9 14.2 9 12.8 9 11.4 9 7.3 12.3 4 16.4 4c3.5 0 6.4 2.2 7.6 5.3.3-.7.6-1.3.9-1.9z" fill="#1b96ff"/>
    </svg>

    <h1 class="console-header__title">Product Design Projects</h1>
    <span class="console-header__byline">Joharvi Garcia · Senior Product Designer</span>
  </header>

  <div class="console-body">

    <aside class="sidebar" id="sidebar">
      <!-- Toggle rail (always visible, left edge) -->
      <button class="sidebar__rail" id="sidebar-toggle" aria-expanded="true" aria-label="Collapse sidebar">
        <svg class="sidebar__rail-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M9 3L5 7L9 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="sidebar__pane">

        <!-- Section 1: About -->
        <div class="sidebar__section is-open">
          <button class="sidebar__section-hd" aria-expanded="true">
            <span class="sidebar__section-title">Candidate Profile</span>
            <svg class="sidebar__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="sidebar__section-bd">
            <div class="sidebar__profile">
              <p class="sidebar__profile-name">Joharvi Garcia</p>
              <p class="sidebar__profile-title">Senior Visual and Product Designer</p>
              <p class="sidebar__profile-role">Senior Product Designer · Concentrix</p>
              <div class="sidebar__clock-row">
                <svg class="sidebar__clock-icon" width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                  <circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M5.5 3.5V5.5l1.5 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
                <span id="gtm3-clock" class="sidebar__clock-time">--:--:--</span>
                <span class="sidebar__clock-tz">GMT−3</span>
              </div>
              <a class="sidebar__address" href="https://maps.app.goo.gl/WNBuWxRTw72b5htd7" target="_blank" rel="noopener">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
                  <path d="M5 .5C3.07.5 1.5 2.07 1.5 4c0 2.8 3.5 5.5 3.5 5.5S8.5 6.8 8.5 4C8.5 2.07 6.93.5 5 .5zm0 4.75a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z"/>
                </svg>
                Mariano Fragueiro 585, Córdoba
              </a>
            </div>
          </div>
        </div>

        <!-- Section 2: Case Studies -->
        <div class="sidebar__section is-open">
          <button class="sidebar__section-hd" aria-expanded="true">
            <span class="sidebar__section-title">Relevant Salesforce Projects</span>
            <svg class="sidebar__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="sidebar__section-bd">
            <nav class="sidebar__nav" aria-label="Case studies">
              <button class="sidebar__nav-btn" data-open="sci">
                <span class="sidebar__nav-num">01</span>
                Strategic Customer Investment (SCI) 2.0
              </button>
              <button class="sidebar__nav-btn" data-open="skills">
                <span class="sidebar__nav-num">02</span>
                Skills Insights App Redesign
              </button>
              <button class="sidebar__nav-btn" data-open="playground">
                <span class="sidebar__nav-num">03</span>
                Opportunity Playground
              </button>
              <button class="sidebar__nav-btn" data-open="orgsync">
                <span class="sidebar__nav-num">04</span>
                OrgSync App
              </button>
            </nav>
          </div>
        </div>

        <!-- Section 3: Portfolio -->
        <div class="sidebar__section is-open">
          <button class="sidebar__section-hd" aria-expanded="true">
            <span class="sidebar__section-title">Full Design Portfolio</span>
            <svg class="sidebar__chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="sidebar__section-bd">
            <nav class="sidebar__nav" aria-label="Portfolio links">
              <a class="sidebar__nav-link" href="https://joharvigarcia.webflow.io/" target="_blank" rel="noopener">
                Portfolio
                <svg width="9" height="9" viewBox="0 0 9 9" fill="none" aria-hidden="true"><path d="M3.5 1.5H1.5a1 1 0 00-1 1V7.5a1 1 0 001 1H7a1 1 0 001-1V5.5M5.5 1.5H7.5v2M7.5 1.5L4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
              <a class="sidebar__nav-link" href="https://www.behance.net/joharvigarcia" target="_blank" rel="noopener">
                Behance
                <svg width="9" height="9" viewBox="0 0 9 9" fill="none" aria-hidden="true"><path d="M3.5 1.5H1.5a1 1 0 00-1 1V7.5a1 1 0 001 1H7a1 1 0 001-1V5.5M5.5 1.5H7.5v2M7.5 1.5L4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
              <a class="sidebar__nav-link" href="https://www.linkedin.com/in/joharvi-garcia-product-designer/" target="_blank" rel="noopener">
                LinkedIn
                <svg width="9" height="9" viewBox="0 0 9 9" fill="none" aria-hidden="true"><path d="M3.5 1.5H1.5a1 1 0 00-1 1V7.5a1 1 0 001 1H7a1 1 0 001-1V5.5M5.5 1.5H7.5v2M7.5 1.5L4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a>
            </nav>
          </div>
        </div>

      </div><!-- /.sidebar__pane -->
    </aside>

    <main class="console-stage" id="stage" role="main" aria-label="Project card gallery">
      <div class="card-gallery" id="card-gallery"></div>
    </main>

  </div><!-- /.console-body -->
</div>

<script src="app.js"></script>
</body>
</html>
